name: generate
on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Release note for this change, for example "feat: DMs beta messaging". Empty = written from the API diff.'
        required: false
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Starts the tests on the generated branch, see the last step.
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install packages
        run: npm clean-install
      - name: Fetch OpenAPI spec
        run: npm run fetch-openapi
      - name: Generate actions
        run: npm run generate
      # The commit message lists what changed in the API, so the release notes say what users get.
      # A spec change that leaves the actions as they were gets a chore: title and publishes nothing.
      - name: Describe API changes
        id: changes
        run: >-
          node scripts/describe-api-changes.mjs --spec openapi/bundlesocial.openapi.json
          --generated generated --generated README.md
          --branch generate-zapier --title "$TITLE"
        env:
          # Lets the script see whether the generated PR is still open.
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ inputs.title }}
      - name: Create pull request
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: ${{ steps.changes.outputs.commit-message }}
          title: ${{ steps.changes.outputs.title }}
          body: ${{ steps.changes.outputs.body }}
          branch: generate-zapier
          base: main
          labels: ${{ steps.changes.outputs.breaking == 'true' && 'generate-zapier,breaking-change' || 'generate-zapier' }}
          delete-branch: true
      # Pushes made with GITHUB_TOKEN start no workflows; a dispatch is the exception, and its checks show on the PR.
      - name: Run tests on the pull request
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tests.yml --repo ${{ github.repository }} --ref generate-zapier
